# Spec: Genesis Markdown/00-Meta/Build Order.md  (Phase 0 — Decide and scaffold)
[project]
name = "genesis"
version = "0.0.1"
description = "Genesis Agent — a voice-driven, multi-agent autonomous trading system."
readme = "README.md"
# Pinned to 3.12 deliberately: the trading corpus (vectorbt, freqtrade, nautilus,
# qlib) does not yet support 3.13+, and the system's numeric core must run on the
# same interpreter as the libraries it learns from. See 80-Repos/Trading Corpus Index.md
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    # Daemon And Cadence: "The calendar must be real (market holidays, half-days,
    # DST). Getting this wrong means the system backtests during the open and
    # scans on Christmas." Hand-rolling NYSE's rules is precisely that failure.
    "exchange-calendars>=4.5",
    # Voice Stack: the HTTP client is core because it is also how the LLM tiers
    # and every future MCP data path talk to the world. One connection-pooling
    # client, warmed once -- a fresh TLS handshake is 400 ms against a 400 ms
    # budget, which is the whole latency argument in one line.
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.scripts]
genesis = "genesis.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Voice is a surface, not the spine (Voice Stack.md), so the audio stack is an
# extra: a headless daemon host runs the whole system without PortAudio, and
# `genesis voice` is the only thing that needs it. faster-whisper is here
# rather than core for the same reason plus size -- it pulls ctranslate2 and a
# model download, and it is only ever the local wake gate and the offline STT
# fallback.
voice = [
    "sounddevice>=0.4",
    "faster-whisper>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genesis"]

[tool.pytest.ini_options]
# evals/ is deliberately excluded from the default run: they are LLM-behaviour
# checks (Phase 2+), non-deterministic and slow. Run them with `pytest evals`.
testpaths = ["tests"]
pythonpath = ["src", "tests", "."]
addopts = "-q --strict-markers"
markers = [
    "eval: an LLM-behaviour eval, not a unit test (see evals/README.md)",
    # Crash tests spawn real subprocesses and SIGKILL them, so they are slower
    # than the rest. They run by DEFAULT and are only marked so they can be
    # deselected deliberately (`-m "not crash"`). A crash-durability test that
    # is skipped by default is worthless.
    "crash: spawns a subprocess and kills it with SIGKILL",
]
