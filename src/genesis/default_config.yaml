# Spec: Genesis Markdown/10-Architecture/Config And Secrets.md
#
# Layer 1 of the config stack: the defaults shipped in code.
#
# These are the *safe* values. Later layers override them:
#   1. this file          — defaults shipped in code
#   2. ~/.genesis/config.yaml — human-edited behaviour
#   3. environment        — SECRETS ONLY, never behaviour
#   4. runtime            — Dashboard toggles (Phase 6), persisted back with an audit entry
#
# Rule: secrets in env, behaviour in config. Never an API key in this file.
# `genesis config init` writes a commented copy of this to ~/.genesis/config.yaml.

identity:
  wake_word: genesis
  voice_id: EXAVITQu4vr4xnSDxMaL   # ElevenLabs "Sarah" — a PREMADE voice.
                                  # Behaviour, not a secret: the key lives in
                                  # ELEVENLABS_API_KEY, this does not.
                                  #
                                  # Premade on purpose. Library, professional and
                                  # cloned voices return 402 on a free plan
                                  # ("Free users cannot use library voices via the
                                  # API"), so shipping one as the default means the
                                  # first thing a new install does is fail to speak.
                                  # Swap in any voice you like once the plan allows
                                  # it — `genesis voice --say "test"` verifies.
  persona: butler          # calm, concise, precise
  verbosity: brief         # terse | brief | full

approval:
  # confirm is the system-wide default and a hard rule: never ship a default that
  # trades unattended. See 50-Risk/Safety Invariants.md and CLAUDE.md rule 5.
  # (`advisory` is only the starting point for the execution MCP's own Phase 7
  # rollout — a different thing from the system default.)
  mode: confirm            # advisory | confirm | auto-within-limits | halt
  confirmation_ttl_sec: 60
  require_ticker_in_confirmation: true

risk:                      # the signed envelope — see 50-Risk/Risk Envelope.md
  max_position_pct: 5.0
  max_portfolio_heat_pct: 6.0
  max_daily_loss_pct: 2.0
  max_correlated_exposure_pct: 10.0
  # Open Questions §1 (2026-09-04): IBKR, CME equity-index futures. Roots, not
  # contracts -- the contract month comes from the chart's symbol id.
  symbol_allowlist: [ES, NQ, MES, MNQ, RTY, M2K, YM, MYM]
  # Adds the S&P 500 and the core ETFs to the roots above, from the snapshot
  # `genesis universe refresh` writes. The gate still does one set membership
  # test — resolving the index is done in advance, on purpose, because a reflex
  # that makes an HTTP call is not a reflex.
  equity_universe: true
  # Equities only. Futures use the contract's own trading hours as IBKR
  # reports them, which know about holidays and the daily halt; this does not.
  session_window:
    start: "09:45"
    end: "15:45"
    tz: America/New_York
  prop_firm: null          # Open Questions §2 — none for v1
  # Futures limits (2026-09-13). Contracts and dollars, because a percentage of
  # equity against one NQ contract's notional is not a limit anyone can reason about.
  max_contracts_per_symbol: 2
  max_daily_loss_usd: 2000
  max_price_deviation_pct: 2.0

brokers:
  primary:
    kind: ibkr             # Open Questions §1 (2026-09-04) — IB Gateway, CME futures
    mode: paper            # paper | live. Live also needs Paper To Live Promotion.
    # no keys come from env here: IBKR authenticates at the gateway container

# The order path — 20-Agents/Execution/Execution Family.md. Off until turned on:
# it needs the gateway with Read-Only API off (paper logins only) and the
# ibkr market data adapter enabled.
execution:
  enabled: false
  client_id: 30            # fixed: only the placing client may cancel its orders
  killswitch_client_id: 31
  killswitch_port: 8766
  state_dir: ~/.genesis/execution
  protective_grace_sec: 5

data:
  primary_feed: alpaca
  realtime: false          # see Open Questions §6
  universe: watchlist      # watchlist | sp500 | custom

# The market data plane — 10-Architecture/Market Data Plane.md
#
# Adding IBKR when its adapter lands (Track C) is an edit HERE, not a code
# change. That is what building the plane before the broker bought.
marketdata:
  store_path: ~/.genesis/market/market.duckdb
  budget_path: ~/.genesis/market/budget.db
  adapters:
    # Open Questions §6 — HISTORICAL ONLY, on free credits. IBKR cannot serve
    # backtests: it drops expired futures more than ~2y past expiry and paces
    # at 60 requests / 10 min. This split is why the plane is adapter-shaped.
    databento: { tier: 3, historical_only: true }
    # Free, keyless, equities and indices. Refuses futures on purpose — its
    # "ES=F" is a continuous series with an undocumented roll, which is a
    # different instrument. See Open Questions §13.
    yfinance:  { tier: 3 }
    # Deterministic replay, for tests and offline work.
    csv:       { tier: 3, enabled: false, root: ~/.genesis/market/replay }
    # The broker feed. Open Questions §1.
    #
    # Disabled by default because it needs IB Gateway running and logged in
    # (deploy/ib-gateway/). Enabling it is one flag; `genesis ibkr check`
    # reports honestly whether the gateway is actually there.
    #
    # tier 3, NOT 1 — and this is the important line in this file. Tier 1 is
    # what Pre-Trade Risk Engine reads in Phase 7 and nothing else. Promotion
    # requires `genesis ibkr reconcile` against Databento, the tolerance written
    # into Market Data Sources.md, and a test. "It connected" is not evidence of
    # execution truth; assuming otherwise is the drift Biological Design warns
    # about, and it is the kind that loses money quietly.
    #
    # market_data_type: delayed needs no subscription and exercises every line
    # of the adapter. Change to `realtime` when the CME bundle clears.
    ibkr:      { tier: 3, enabled: false, host: 127.0.0.1, port: 4002,
                 client_id: 17, market_data_type: delayed }
  chains:
    # Market Data Sources' per-consumer fallback chains, resolved in one place
    # instead of inside each agent.
    # IBKR first once enabled: it is the most trusted source that can answer,
    # and the chain is ordered by trust rather than by convenience. It is
    # skipped with a stated reason when the gateway is down, so a chain with a
    # dead IBKR degrades to Databento rather than failing.
    default:        [ibkr, databento, yfinance]
    chart_markup:   [ibkr, databento, yfinance]
    level_watcher:  [ibkr, databento, yfinance]
    # "stored bars only" — backtests never touch a vendor, which is also
    # correct given IBKR's two-year expired-contract limit.
    backtests:      []
  # Series `genesis serve` keeps streaming from IBKR into the store while it
  # runs, and backfills from the last stored bar on every start. Needs the ibkr
  # adapter enabled. An explicit contract month, never "front month" (Open
  # Questions §13) -- rolling is an edit here. Example:
  #   - { symbol_id: "FUT:CME:NQ:2026-12", timeframe: 1m }
  live: []

llm:
  # Fixed by LLM Model Tiers.md + Open Questions Section 4: no GPU on the build
  # machine, so nothing generative runs local. The measured Ollama latency
  # (1.3-6.5 s for a one-word class, against a <100 ms budget) is why nano is
  # not a model at all -- intent classification is deterministic code.
  nano:      { backend: none,      model: "" }
  small:     { backend: anthropic, model: claude-haiku-4-5 }
  large:     { backend: anthropic, model: claude-opus-5 }
  vision:    { backend: anthropic, model: claude-opus-5 }
  embedding: { backend: onnx-local, model: bge-small-en-v1.5 }
  daily_token_budget: 2000000

memory:
  db_path: ~/.genesis/genesis.db
  vault_path: ~/GenesisVault      # Open Questions §5 — dedicated vault
  consolidation_hour: 21

agents:
  screener:  { enabled: true,  interval_sec: 300 }
  optimizer: { enabled: true,  max_wall_min: 120 }
  ml-signal: { enabled: false }

voice:
  stt: elevenlabs          # elevenlabs | whisper-local
  tts: elevenlabs          # elevenlabs | piper-local
  fallback_to_local: true

logging:
  # Observability.md — two non-episodic streams. The SQLite Episodic Log is Phase 1.
  console: true
  level: info                       # debug | info | warn | error
  jsonl_path: ~/.genesis/logs/genesis.jsonl
